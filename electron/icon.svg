<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5b8def" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 内发光 -->
  <rect width="480" height="480" x="16" y="16" rx="104" fill="url(#glow)"/>
  <!-- 外边框 -->
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="#2a2a4a" stroke-width="2"/>
  <!-- C 字母 -->
  <text x="256" y="355" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="320" fill="url(#text)">C</text>
  <!-- 底部光晕 -->
  <ellipse cx="256" cy="440" rx="140" ry="12" fill="#5b8def" opacity="0.12"/>
</svg>
